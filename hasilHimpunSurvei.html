<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Survey</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #E5DFF4;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
        }

        .form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 700px;
            gap: 12px;
        }

        .formCard {
            background-color: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 24px;
        }

        .headerCard {
            border-top: 10px solid #7248B9;
        }

        .tableContainer {
            overflow-x: auto;
            width: 100%;
            border: 1px solid #dadce0;
            border-radius: 4px;
        }

        .surveyTable {
            width: 100%;
            border-collapse: collapse;
            min-width: 600px;
            text-align: left;
        }

        .surveyTable th,
        .surveyTable td {
            padding: 12px 8px;
            font-size: 14px;
            color: #202124;
            border-bottom: 1px solid #edf0f2;
        }

        .surveyTable th:nth-child(1) {
            width: 40px;
        }

        .surveyTable th:nth-child(2) {
            width: 150px;
        }

        .surveyTable th:nth-child(3) {
            width: 80px;
        }

        .surveyTable th:nth-child(4) {
            width: 100px;
        }

        .surveyTable th:nth-child(5) {
            width: 100px;
        }

        .surveyTable th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #5f6368;
            border-bottom: 2px solid #dadce0;
        }
    </style>
</head>

<body>

    <div class="form">

        <div class="formCard headerCard">
            <h1>Hasil Survey</h1>
        </div>

        <div class="formCard">
            <div class="tableContainer">
                <table class="surveyTable">
                    <thead>
                        <tr>
                            <th>No</th>
                            <th>Nama User</th>
                            <th>Umur User</th>
                            <th>Jenis Kelamin</th>
                            <th>Merokok Y/N</th>
                            <th>Rokok apa aja?</th>
                        </tr>
                    </thead>
                    <tbody id="surveyBody">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script>
        const dataSurvei = JSON.parse(localStorage.getItem("semuaDataSurvei")) || [];
        const tableBody = document.getElementById("surveyBody");

        dataSurvei.forEach((item, index) => {
            const row = document.createElement("tr");

            const noUrut = document.createElement("td");
            noUrut.textContent = index + 1;

            const Dnama = document.createElement("td");
            Dnama.textContent = item.nama;

            const Dumur = document.createElement("td");
            Dumur.textContent = item.umur;

            const DJenisKelamin = document.createElement("td");
            DJenisKelamin.textContent = item.jenisKelamin;

            const DPerokok = document.createElement("td");
            DPerokok.textContent = item.YNrokok;

            const DRokok = document.createElement("td");
            DRokok.textContent = item.macamRokok;

            row.appendChild(noUrut);
            row.appendChild(Dnama);
            row.appendChild(Dumur);
            row.appendChild(DJenisKelamin);
            row.appendChild(DPerokok);
            row.appendChild(DRokok);

            tableBody.appendChild(row);
        });
    </script>

</body>

</html>
