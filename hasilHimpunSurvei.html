<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hasil Survey</title>
    <style>
        /* .borTes {
            border: 2px solid red;
            box-sizing: border-box;
        } */

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #E5DFF4;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
        }

        .form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 700px;
            gap: 12px;
        }

        .formCard {
            background-color: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 24px;
        }

        .headerCard {
            border-top: 10px solid #7248B9;
        }

        .h1 {
            font-size: 32px;
            font-weight: 400;
            color: #202124;
        }

        .table {
            overflow-x: auto;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: 40px 150px 80px 100px 100px 1fr;
            width: 100%;
            min-width: 600px;
            border: 1px solid #dadce0;
            border-radius: 4px;
            overflow: hidden;
        }

        .th,
        .td {
            padding: 12px 8px;
            font-size: 14px;
            color: #202124;
            display: flex;
            align-items: center;
            border-bottom: 1px solid #edf0f2;
        }

        .th {
            background-color: #f8f9fa;
            font-weight: 600;
            color: #5f6368;
            border-bottom: 2px solid #dadce0;
        }
    </style>
</head>

<body>

    <div class="form borTes">

        <div class="formCard headerCard borTes">
            <h1>Hasil Survey</h1>
        </div>

        <div class="formCard borTes">
            <div class="table borTes">
                <div class="grid borTes">

                    <div class="th borTes">No</div>
                    <div class="th borTes">Nama User</div>
                    <div class="th borTes">Umur User</div>
                    <div class="th borTes">Jenis Kelamin</div>
                    <div class="th borTes">Merokok Y/N</div>
                    <div class="th borTes">Rokok apa aja?</div>

                    <!-- <div class="td borTes">1.</div>
                    <div class="td borTes">Fatawa imam al Muftin</div>
                    <div class="td borTes">24</div>
                    <div class="td borTes">L</div>
                    <div class="td borTes">Y</div>
                    <div class="td borTes">Ezbles</div> -->

                </div>
            </div>
        </div>

    </div>

    <script>
        let data = [];
        data = localStorage.getItem("semuaDataSurvei");
        data = JSON.parse(data);

        const container = document.querySelector(".grid");

        data.forEach((item, index) => {
            const noUrut = document.createElement("div")
            noUrut.classList.add("td")
            noUrut.textContent = (index + 1);

            const Dnama = document.createElement("div")
            Dnama.classList.add("td")
            Dnama.textContent = item.nama;

            const Dumur = document.createElement("div");
            Dumur.classList.add("td");
            Dumur.textContent = item.umur;

            const DJK = document.createElement("div")
            DJK.classList.add("td")
            DJK.textContent = item.jenisKelamin

            const DPR = document.createElement("div")
            DPR.classList.add("td")
            DPR.textContent = item.YNrokok;

            const DRokok = document.createElement("div")
            DRokok.classList.add("td")
            DRokok.textContent = item.macamRokok;

            container.appendChild(noUrut);
            container.appendChild(Dnama);
            container.appendChild(Dumur);
            container.appendChild(DJK);
            container.appendChild(DPR);
            container.appendChild(DRokok);
        });
    </script>


</body>

</html>
