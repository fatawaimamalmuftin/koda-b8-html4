<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentang form</title>
</head>

<body>
    <div>
        <form action="/koda-b8-html4/hasilHimpunSurvei.html" method="get" target="_blank">
            <label for="namaUser">Siapa nama anda?</label>
            <div>
                <input type="text" name="namaUser" id="nama">
            </div>

            <label for="umurUser">Berapa umur anda?</label>
            <div>
                <input type="text" name="umurUser">
            </div>

            <label for="JK">Apa jenis kelamin anda?</label>

            <div>
                <input type="radio" name="JK" value="laki-laki">
                <label for="JK">laki-laki</label>

                <input type="radio" name="JK" value="Perempuan">
                <label for="JK">Perempuan</label>
            </div>

            <label for="Rokok">Apakah anda perokok?</label>

            <div>
                <input type="radio" name="PR" value="Ya">
                <label for="PR">Ya</label>
                <input type="radio" name="PR" value="Tidak">
                <label for="PR">Tidak</label>
            </div>

            <label for="RokokApa">Rokok apa aja yg pernah kamu coba?</label>

            <div>
                <input type="checkbox" name="RokokApa" id="ggF">
                <label for="RokokApa">Gudang Garasm Filter</label>
            </div>

            <div>
                <input type="checkbox" name="RokokApa" id="LS">
                <label for="RokokApa">Lucky Strike</label>
            </div>

            <div>
                <input type="checkbox" name="RokokApa" id="MLB">
                <label for="RokokApa">Malboro</label>
            </div>

            <div>
                <input type="checkbox" name="RokokApa" id="ESE">
                <label for="RokokApa">Esse</label>
            </div>

            <div>
                <button type="reset">Hapus semua</button>
                <button type="submit">Submit</button>
            </div>
        </form>
    </div>
</body>

</html>
