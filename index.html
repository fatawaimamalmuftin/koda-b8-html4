<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tentang form</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: #E5DFF4;
            display: flex;
            justify-content: center;
            padding: 24px 16px;
        }

        .form {
            display: flex;
            flex-direction: column;
            width: 100%;
            max-width: 700px;
            gap: 12px;
        }

        .formCard {
            background-color: #ffffff;
            border: 1px solid #dadce0;
            border-radius: 8px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            border-left: 1px solid #dadce0;
            border-right: 1px solid #dadce0;
            border-bottom: 1px solid #dadce0;
        }

        .headerCard {
            border-top: 10px solid #7248B9;
            position: relative;
        }

        .h1 {
            font-size: 32px;
            font-weight: 400;
            color: #202124;
            margin-bottom: 8px;
        }

        .Pertanyaan {
            font-size: 16px;
            color: #202124;
            font-weight: 500;
            display: block;
            width: 100%;
        }

        .input {
            width: 100%;
            max-width: 360px;
            border: none;
            border-bottom: 1px solid #dadce0;
            padding: 8px 0;
            font-size: 14px;
            outline: none;
            transition: border-color 0.2s ease;
        }

        .input:focus {
            border-bottom: 2px solid #7248B9;
        }

        .optionRow {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 8px 0;
            cursor: pointer;
            user-select: none;
        }

        .optionRow input[type="radio"],
        .optionRow input[type="checkbox"] {
            width: 20px;
            height: 20px;
            accent-color: #7248B9;
            cursor: pointer;
        }

        .buttonGrup {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .btnSubmit {
            background-color: #7248B9;
            color: white;
            border: none;
            padding: 10px 24px;
            border-radius: 4px;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            transition: background-color 0.1s ease, transform 0.1s ease;
        }

        .btnSubmit:hover {
            background-color: #5b359c;
        }

        .btnSubmit:active {
            transform: scale(0.96);
        }

        .btn-reset {
            background: none;
            border: none;
            color: #7248B9;
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
            padding: 10px 16px;
            border-radius: 4px;
            transition: background-color 0.1s ease;
        }
    </style>
</head>

<body>

    <form class="form" id="formPerokok">
        <div class="formCard headerCard">
            <h1>Kuisioner Survei</h1>
        </div>

        <div class="formCard">
            <label class="Pertanyaan" for="namaUser">Siapa nama anda?</label>
            <input type="text" name="namaUser" id="namaUser" class="input" placeholder="Jawaban teks singkat" required>
        </div>

        <div class="formCard">
            <label class="Pertanyaan" for="umurUser">Berapa umur anda?</label>
            <input type="text" name="umurUser" id="umurUser" class="input" placeholder="Jawaban teks singkat" required>
        </div>

        <fieldset class="formCard">
            <legend class="Pertanyaan">Apa jenis kelamin anda?</legend>
            <div>
                <div class="optionRow">
                    <input type="radio" name="JK" id="jk-l" value="Laki-laki" required>
                    <label for="jk-l">Laki-laki</label>
                </div>
                <div class="optionRow">
                    <input type="radio" name="JK" id="jk-p" value="Perempuan">
                    <label for="jk-p">Perempuan</label>
                </div>
            </div>
        </fieldset>

        <fieldset class="formCard">
            <legend class="Pertanyaan">Apakah anda perokok?</legend>
            <div>
                <div class="optionRow">
                    <input type="radio" name="PR" id="pr-ya" value="Ya" required>
                    <label for="pr-ya">Ya</label>
                </div>
                <div class="optionRow">
                    <input type="radio" name="PR" id="pr-tidak" value="Tidak">
                    <label for="pr-tidak">Tidak</label>
                </div>
            </div>
        </fieldset>

        <fieldset class="formCard">
            <legend class="Pertanyaan">Rokok apa aja yg pernah kamu coba?</legend>
            <div>
                <div class="optionRow">
                    <input type="checkbox" name="RokokApa" id="ggF" value="Gudang Garam Filter">
                    <label for="ggF">Gudang Garam Filter</label>
                </div>
                <div class="optionRow">
                    <input type="checkbox" name="RokokApa" id="LS" value="Lucky Strike">
                    <label for="LS">Lucky Strike</label>
                </div>
                <div class="optionRow">
                    <input type="checkbox" name="RokokApa" id="MLB" value="Marlboro">
                    <label for="MLB">Marlboro</label>
                </div>
                <div class="optionRow">
                    <input type="checkbox" name="RokokApa" id="ESE" value="Esse">
                    <label for="ESE">Esse</label>
                </div>
            </div>
        </fieldset>

        <div class="buttonGrup">
            <button type="submit" class="btnSubmit">Kirim</button>
            <button type="reset" class="btn-reset">Kosongkan formulir</button>
        </div>
    </form>

    <script>
        const formPerokok = document.getElementById("formPerokok");

        formPerokok.addEventListener("submit", function (event) {
            event.preventDefault();

            const UserNama = document.getElementById("namaUser").value;
            const UserUmur = document.getElementById("umurUser").value;

            const cekJK = document.querySelector('input[name="JK"]:checked');
            const JenisKelamin = cekJK.value;

            const cekPR = document.querySelector('input[name="PR"]:checked');
            const PerokokYN = cekPR.value;

            const semuaKotakRokok = document.querySelectorAll('input[name="RokokApa"]:checked');
            let listRokok = [];
            semuaKotakRokok.forEach(function (kotak) {
                listRokok.push(kotak.value);
            });

            const dataBaru = {
                nama: UserNama,
                umur: UserUmur,
                jenisKelamin: JenisKelamin,
                YNrokok: PerokokYN,
                macamRokok: listRokok
            };

            const kumpulanData = JSON.parse(localStorage.getItem("semuaDataSurvei")) || [];

            kumpulanData.push(dataBaru);

            localStorage.setItem("semuaDataSurvei", JSON.stringify(kumpulanData));

            window.location.href = "hasilHimpunSurvei.html";
        });
    </script>

</body>

</html>
